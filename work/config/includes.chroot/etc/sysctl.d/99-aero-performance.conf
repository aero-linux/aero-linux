# Aero Linux Low-Latency & High-Throughput Kernel Parameters
# /etc/sysctl.d/99-aero-performance.conf

# Memory Management with zRAM
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Network & Socket Latency
net.core.default_qdisc = fq_pie
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# File System Inotify Limits (Prevents file-watcher crashes in large projects)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
