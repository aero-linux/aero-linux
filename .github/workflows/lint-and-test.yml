name: Test & Lint Aero Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Unit Tests
        run: |
          cd packages/aero-cli
          PYTHONPATH=. python -m unittest discover -s tests

      - name: Lint Code
        run: |
          flake8 packages/aero-cli/aero --count --select=E9,F63,F7,F82 --show-source --statistics
