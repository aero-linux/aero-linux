# Aero Linux Partitioning Configuration
# Dual-Boot Safe with Windows / BitLocker awareness and zRAM-first architecture
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI System Partition"

# Default filesystem (ext4 with discard and noatime mount options)
defaultFileSystemType: "ext4"

# Available choices for partitioning
# 1. Install alongside (Dual boot with Windows / existing OS)
# 2. Replace a partition
# 3. Erase disk
# 4. Manual partitioning
partitioningChoices:
  - alongside
  - replace
  - erase
  - manual

# Swap architecture: Aero uses zRAM ZSTD compressed RAM by default.
# Default to "none" to preserve SSD write cycles and maximize disk space.
userSwapChoices:
  - none
  - small
  - suspend
  - file
defaultSwapChoice: none

# Minimum hardware requirements enforced by installer
requiredStorage: 15.0
requiredRam: 2.0

# Partition table safety rules
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true
alwaysShowPartitionLabels: true
