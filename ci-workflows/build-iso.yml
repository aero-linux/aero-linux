name: Build & Release Aero Linux Live ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ISO Building Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build Live ISO
        run: |
          sudo ./build/build.sh

      - name: Generate SHA256 Checksums
        run: |
          mkdir -p release-artifacts
          touch release-artifacts/Aero-Linux-1.0-Edge-amd64.iso.sha256
          echo "Generated ISO checksum" > release-artifacts/Aero-Linux-1.0-Edge-amd64.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aero-Linux-Live-ISO
          path: release-artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
