name: Build & Release Live ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Bootable Live ISO & Publish Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi gir1.2-gtk-3.0 dpkg-dev xorriso live-build squashfs-tools

    - name: Run Test Suite
      run: |
        make test

    - name: Build Debian Package (.deb)
      run: |
        make deb

    - name: Generate Checksums
      run: |
        cd dist
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.deb
          dist/SHA256SUMS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
